name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # GitHub merge queue: fires for each group when the queue requests checks
  # on the *combined* tree (base + all queued PRs). `GITHUB_SHA` for this
  # event is the merge-group commit itself, and the default
  # `actions/checkout` below checks out `github.sha` — so every job here
  # builds the integrated tree, not a PR head or main.
  merge_group:
    types: [checks_requested]
    # No `branches:` filter here (unlike push/pull_request above): a merge
    # group is only ever created against the branch the queue protects —
    # the default branch — so a filter would be redundant.
  # Fires when `/repo:release` (or a manual `gh release create`) publishes a
  # GitHub Release — used below to attach the static Linux binary as a
  # release asset. Does NOT fire for draft releases, only `published`.
  release:
    types: [published]
  # Manual fallback: `pull_request`/`push` webhook deliveries can silently
  # stop firing (see issue #66) without any change to this file or the repo's
  # Actions settings. `workflow_dispatch` lets a run be queued directly
  # against any branch/PR head, independent of webhook delivery, via
  # `gh workflow run build.yml --ref <branch>` or the Actions UI "Run
  # workflow" button. No inputs needed.
  workflow_dispatch:

# Merge-queue runs must never be cancelled or superseded by PR/push runs:
# they get their own group keyed by the group's unique head SHA
# (`github.sha` — the merge-group commit), and `cancel-in-progress: false`
# keeps a running queue run safe within it.
#
# Every other event keeps the pre-merge-group behavior exactly: there was
# NO concurrency block before this trigger was added, so same-ref runs
# executed in parallel — nothing was queued and nothing was cancelled. That
# is preserved by giving each non-merge-group run a UNIQUE group (keyed by
# `github.run_id`, unique per run): a group of one is never queued behind,
# evicted by, or cancelled because of another run. Keying those runs by ref
# instead would serialize them — and let a newly queued run evict a pending
# one, because `cancel-in-progress: false` protects only RUNNING runs, not
# pending ones. (A manual `workflow_dispatch` against `main` therefore still
# runs independently of any push run, as the fallback above intends.)
concurrency:
  group: ${{ github.event_name == 'merge_group' && format('{0}-merge-group-{1}', github.workflow, github.sha) || format('{0}-{1}-{2}', github.workflow, github.ref, github.run_id) }}
  cancel-in-progress: false

jobs:
  # build-macos / build-linux run unconditionally, so they report the same
  # check contexts on a merge group as on a PR. The context names are the
  # bare job ids `build-macos` / `build-linux` (verified against real check
  # runs — no workflow prefix); those are the names a merge queue can
  # require. This file is the repo's only *repo-owned* workflow, but not the
  # only suite on a PR head: CodeQL default setup (a GitHub-managed dynamic
  # workflow, no file in this repo) adds four more contexts (`CodeQL`,
  # `Analyze (actions)`, `Analyze (swift)`, `Analyze (python)`) beside them —
  # its merge_group behavior is unverified until a queue exists, and is an
  # open prerequisite for any required-check selection that names a CodeQL
  # context. `publish-linux-release-asset` stays gated to `release` events
  # below: it is release packaging, not a merge-gating suite.
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # Package.swift passes `-swift-version 6`, which Swift 5.x compilers
      # (e.g. Xcode 15.x) reject (`error: invalid value '6'`). Don't rely on
      # the runner image's default Xcode: explicitly select the newest
      # Xcode 16.x to get a Swift-6-capable toolchain before building.
      - name: Select Swift 6 toolchain (Xcode 16+)
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$XCODE" ]; then
            echo "No Xcode 16.x found on this runner. Available Xcodes:"
            ls -d /Applications/Xcode_*.app || true
            exit 1
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          swift --version

      - name: Build macOS App
        run: |
          cd menubar-app/LLMMonitor
          swift build

      - name: Self-test (portable core)
        run: |
          cd menubar-app/LLMMonitor
          .build/debug/LLMMonitor selftest

  build-linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v7

      - name: Install SQLite dev headers
        run: apt-get update && apt-get install -y libsqlite3-dev

      - name: Build (Linux headless)
        run: |
          cd menubar-app/LLMMonitor
          swift build

      - name: Self-test (portable core)
        run: |
          cd menubar-app/LLMMonitor
          .build/debug/LLMMonitor selftest

      - name: Smoke run (no credentials)
        run: |
          cd menubar-app/LLMMonitor
          .build/debug/LLMMonitor --once
          # The binary resolves home via homeDirectoryForCurrentUser (passwd
          # entry), while Actions containers set HOME elsewhere — check both.
          passwd_home=$(getent passwd "$(id -u)" | cut -d: -f6)
          for h in "$passwd_home" "$HOME"; do
            if test -f "$h/.llm-monitor/usage.db"; then
              # The pre-2.0 name must stay a symlink to the new directory (loom-daemon reads it).
              test "$(readlink "$h/.claude-monitor")" = ".llm-monitor" && found=1 && break
            fi
          done
          test -n "${found:-}"

      # A plain `swift build` output is dynamically linked against the Swift
      # runtime, which is not installed on a bare Linux host — see #185. A
      # release build with `--static-swift-stdlib` links the Swift/Foundation
      # runtime statically so the binary runs with no toolchain on the host.
      - name: Build static release binary (Linux headless)
        run: |
          cd menubar-app/LLMMonitor
          swift build -c release --static-swift-stdlib

      - name: Verify no dynamic Swift/Foundation/dispatch dependency
        run: |
          cd menubar-app/LLMMonitor
          BIN=.build/release/LLMMonitor
          echo "ldd output:"
          ldd "$BIN"
          if ldd "$BIN" | grep -qiE 'libswift|libfoundation|libdispatch'; then
            echo "::error::Static release binary still depends on a dynamic Swift/Foundation/dispatch library:"
            ldd "$BIN" | grep -iE 'libswift|libfoundation|libdispatch'
            exit 1
          fi

      - name: Self-test (static release binary)
        run: |
          cd menubar-app/LLMMonitor
          .build/release/LLMMonitor selftest

      - name: Smoke run (static release binary, no credentials)
        run: |
          cd menubar-app/LLMMonitor
          rm -rf "$HOME/.claude-monitor" "$HOME/.llm-monitor"
          .build/release/LLMMonitor --once
          passwd_home=$(getent passwd "$(id -u)" | cut -d: -f6)
          for h in "$passwd_home" "$HOME"; do
            if test -f "$h/.llm-monitor/usage.db"; then
              # The pre-2.0 name must stay a symlink to the new directory (loom-daemon reads it).
              test "$(readlink "$h/.claude-monitor")" = ".llm-monitor" && found=1 && break
            fi
          done
          test -n "${found:-}"

      - name: Stage static release binary
        run: |
          mkdir -p dist
          cp menubar-app/LLMMonitor/.build/release/LLMMonitor dist/llm-monitor-linux-x64
          # Pre-2.0 asset name, still attached so a 1.x install-linux.sh
          # --from-release keeps working. Remove with the ~/.claude-monitor symlink.
          cp dist/llm-monitor-linux-x64 dist/claude-monitor-linux-x64
          chmod 755 dist/llm-monitor-linux-x64 dist/claude-monitor-linux-x64

      - name: Upload static release binary as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: llm-monitor-linux-x64
          path: |
            dist/llm-monitor-linux-x64
            dist/claude-monitor-linux-x64
          if-no-files-found: error

  # Attaches the static Linux binary built by build-linux to the GitHub
  # Release that just triggered this run. Only fires on `release: published`
  # — every push/PR run still builds and verifies the same binary above via
  # build-linux, it just doesn't get uploaded anywhere.
  publish-linux-release-asset:
    name: Attach llm-monitor-linux-x64 to GitHub Release
    needs: build-linux
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download static Linux binary artifact
        uses: actions/download-artifact@v8
        with:
          name: llm-monitor-linux-x64
          path: dist

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod 755 dist/llm-monitor-linux-x64 dist/claude-monitor-linux-x64
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/llm-monitor-linux-x64 dist/claude-monitor-linux-x64 \
            --repo "${{ github.repository }}" \
            --clobber
